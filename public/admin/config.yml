backend:
  name: github
  repo: qianmeihan/qianmeihan.github.io
  branch: main
  auth_methods: [token]

media_folder: public/media
public_folder: /media

collections:
  - name: portfolio
    label: 作品集内容 / Portfolio Content
    files:
      - name: site
        label: 钱美含作品集 / Meihan Qian Portfolio
        file: public/content/site.json
        fields:
          - label: 元数据 / Metadata
            name: meta
            widget: object
            fields:
              - { label: 更新日期 / Updated date, name: updatedAt, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
              - label: 默认语言 / Default language
                name: defaultLocale
                widget: select
                options:
                  - { label: 中文, value: zh }
                  - { label: English, value: en }

          - label: 个人资料 / Profile
            name: profile
            widget: object
            fields:
              - label: 姓名 / Name
                name: name
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: string }
                  - { label: English, name: en, widget: string }
              - { label: 年龄 / Age, name: age, widget: number, value_type: int, min: 18, max: 100 }
              - { label: 公开邮箱 / Public email, name: email, widget: string }
              - label: 所在地 / Location
                name: location
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: string }
                  - { label: English, name: en, widget: string }
              - label: 职业定位 / Professional role
                name: role
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: string }
                  - { label: English, name: en, widget: string }
              - label: 职业照 / Portrait
                name: portrait
                widget: object
                fields:
                  - { label: 稳定 ID, name: id, widget: string }
                  - { label: 图片 / Image, name: src, widget: image }
                  - label: 替代文本 / Alt text
                    name: alt
                    widget: object
                    fields:
                      - { label: 中文, name: zh, widget: string }
                      - { label: English, name: en, widget: string }
                  - label: 署名 / Credit
                    name: credit
                    widget: object
                    fields:
                      - { label: 中文, name: zh, widget: string }
                      - { label: English, name: en, widget: string }
                  - { label: 来源网址 / Source URL, name: sourceUrl, widget: string }
                  - label: 使用说明 / Usage note
                    name: usageNote
                    widget: object
                    fields:
                      - { label: 中文, name: zh, widget: text }
                      - { label: English, name: en, widget: text }
              - label: 公开链接 / Public links
                name: links
                widget: list
                summary: "{{fields.id}} · {{fields.href}}"
                fields:
                  - { label: 稳定 ID, name: id, widget: string }
                  - label: 标签 / Label
                    name: label
                    widget: object
                    fields:
                      - { label: 中文, name: zh, widget: string }
                      - { label: English, name: en, widget: string }
                  - { label: 链接 / URL, name: href, widget: string }

          - label: 首屏 / Hero
            name: hero
            widget: object
            fields:
              - label: 眉题 / Eyebrow
                name: eyebrow
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: string }
                  - { label: English, name: en, widget: string }
              - label: 主标题 / Title
                name: title
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: text }
                  - { label: English, name: en, widget: text }
              - label: 摘要 / Summary
                name: summary
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: text }
                  - { label: English, name: en, widget: text }

          - label: 职业概述 / Profile summary
            name: summary
            widget: object
            fields:
              - label: 标题 / Heading
                name: heading
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: string }
                  - { label: English, name: en, widget: string }
              - label: 段落 / Paragraphs
                name: paragraphs
                widget: list
                fields:
                  - { label: 中文, name: zh, widget: text }
                  - { label: English, name: en, widget: text }

          - label: 工作经历 / Experience
            name: experience
            widget: list
            summary: "{{fields.period.zh}} · {{fields.role.zh}}"
            fields:
              - { label: 稳定 ID, name: id, widget: string }
              - label: 时间 / Period
                name: period
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: string }
                  - { label: English, name: en, widget: string }
              - label: 职位 / Role
                name: role
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: string }
                  - { label: English, name: en, widget: string }
              - label: 项目或组织背景 / Context
                name: context
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: string }
                  - { label: English, name: en, widget: string }
              - label: 概述 / Summary
                name: summary
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: text }
                  - { label: English, name: en, widget: text }
              - label: 重点 / Highlights
                name: highlights
                widget: list
                fields:
                  - { label: 中文, name: zh, widget: text }
                  - { label: English, name: en, widget: text }

          - label: 工程项目 / Engineering work
            name: projects
            widget: list
            summary: "{{fields.code}} · {{fields.title.zh}}"
            fields:
              - { label: 稳定 ID, name: id, widget: string }
              - { label: 项目编号 / Code, name: code, widget: string }
              - label: 标题 / Title
                name: title
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: string }
                  - { label: English, name: en, widget: string }
              - label: 概述 / Summary
                name: summary
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: text }
                  - { label: English, name: en, widget: text }
              - label: 贡献 / Contributions
                name: contributions
                widget: list
                fields:
                  - { label: 中文, name: zh, widget: text }
                  - { label: English, name: en, widget: text }
              - label: 能力标签 / Capabilities
                name: capabilities
                widget: list
                fields:
                  - { label: 中文, name: zh, widget: string }
                  - { label: English, name: en, widget: string }

          - label: 专利 / Patents
            name: patents
            widget: list
            summary: "{{fields.number}} · {{fields.title.zh}}"
            fields:
              - { label: 稳定 ID, name: id, widget: string }
              - { label: 专利号 / Patent number, name: number, widget: string }
              - label: 标题 / Title
                name: title
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: string }
                  - { label: English, name: en, widget: string }
              - label: 状态 / Status
                name: status
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: string }
                  - { label: English, name: en, widget: string }
              - label: 概述 / Summary
                name: summary
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: text }
                  - { label: English, name: en, widget: text }
              - label: 工程价值 / Engineering value
                name: engineeringValue
                widget: list
                fields:
                  - { label: 中文, name: zh, widget: text }
                  - { label: English, name: en, widget: text }
              - label: 来源名称 / Source label
                name: sourceLabel
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: string }
                  - { label: English, name: en, widget: string }
              - { label: 来源网址 / Source URL, name: sourceUrl, widget: string }
              - label: 专利图 / Patent image
                name: image
                widget: object
                fields:
                  - { label: 稳定 ID, name: id, widget: string }
                  - { label: 图片 / Image, name: src, widget: image }
                  - label: 替代文本 / Alt text
                    name: alt
                    widget: object
                    fields:
                      - { label: 中文, name: zh, widget: string }
                      - { label: English, name: en, widget: string }
                  - label: 署名 / Credit
                    name: credit
                    widget: object
                    fields:
                      - { label: 中文, name: zh, widget: string }
                      - { label: English, name: en, widget: string }
                  - { label: 来源网址 / Source URL, name: sourceUrl, widget: string }
                  - label: 使用说明 / Usage note
                    name: usageNote
                    widget: object
                    fields:
                      - { label: 中文, name: zh, widget: text }
                      - { label: English, name: en, widget: text }

          - label: 技能组 / Skill groups
            name: skillGroups
            widget: list
            summary: "{{fields.title.zh}}"
            fields:
              - { label: 稳定 ID, name: id, widget: string }
              - label: 标题 / Title
                name: title
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: string }
                  - { label: English, name: en, widget: string }
              - label: 技能 / Skills
                name: items
                widget: list
                fields:
                  - { label: 中文, name: zh, widget: string }
                  - { label: English, name: en, widget: string }

          - label: 教育经历 / Education
            name: education
            widget: list
            summary: "{{fields.period.zh}} · {{fields.institution.zh}}"
            fields:
              - { label: 稳定 ID, name: id, widget: string }
              - label: 时间 / Period
                name: period
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: string }
                  - { label: English, name: en, widget: string }
              - label: 学校 / Institution
                name: institution
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: string }
                  - { label: English, name: en, widget: string }
              - label: 学位 / Degree
                name: degree
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: string }
                  - { label: English, name: en, widget: string }
              - label: 概述 / Summary
                name: summary
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: text }
                  - { label: English, name: en, widget: text }
              - label: 课程 / Coursework
                name: coursework
                widget: list
                fields:
                  - { label: 中文, name: zh, widget: string }
                  - { label: English, name: en, widget: string }

          - label: 行业背景 / Industry context
            name: industryContext
            widget: list
            summary: "{{fields.title.zh}}"
            fields:
              - { label: 稳定 ID, name: id, widget: string }
              - label: 标题 / Title
                name: title
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: string }
                  - { label: English, name: en, widget: string }
              - label: 说明 / Description
                name: description
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: text }
                  - { label: English, name: en, widget: text }
              - label: 配图 / Image
                name: image
                widget: object
                fields:
                  - { label: 稳定 ID, name: id, widget: string }
                  - { label: 图片 / Image, name: src, widget: image }
                  - label: 替代文本 / Alt text
                    name: alt
                    widget: object
                    fields:
                      - { label: 中文, name: zh, widget: string }
                      - { label: English, name: en, widget: string }
                  - label: 署名 / Credit
                    name: credit
                    widget: object
                    fields:
                      - { label: 中文, name: zh, widget: string }
                      - { label: English, name: en, widget: string }
                  - { label: 来源网址 / Source URL, name: sourceUrl, widget: string }
                  - label: 使用说明 / Usage note
                    name: usageNote
                    widget: object
                    fields:
                      - { label: 中文, name: zh, widget: text }
                      - { label: English, name: en, widget: text }
              - label: 资料名称 / Source label
                name: sourceLabel
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: string }
                  - { label: English, name: en, widget: string }
              - { label: 资料网址 / Source URL, name: sourceUrl, widget: string }

          - label: 联系邀请 / Contact
            name: contact
            widget: object
            fields:
              - label: 标题 / Heading
                name: heading
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: string }
                  - { label: English, name: en, widget: string }
              - label: 邀请语 / Invitation
                name: invitation
                widget: object
                fields:
                  - { label: 中文, name: zh, widget: text }
                  - { label: English, name: en, widget: text }
